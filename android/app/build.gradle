plugins { id 'com.android.application' }

def uploadPropertiesFile = file("${System.getProperty('user.home')}/.config/audiobridge/upload.properties")
def uploadProperties = new Properties()
if (uploadPropertiesFile.isFile()) {
    uploadPropertiesFile.withInputStream { uploadProperties.load(it) }
}

android {
    namespace 'com.a1saudio.receiver'
    compileSdk 36

    defaultConfig {
        applicationId 'com.a1saudio.receiver'
        minSdk 29
        targetSdk 36
        versionCode 6
        versionName '0.6.0'
    }

    if (uploadPropertiesFile.isFile()) {
        signingConfigs {
            upload {
                storeFile file(uploadProperties.getProperty('storeFile'))
                storePassword uploadProperties.getProperty('storePassword')
                keyAlias uploadProperties.getProperty('keyAlias')
                keyPassword uploadProperties.getProperty('keyPassword')
            }
        }
        buildTypes {
            release { signingConfig signingConfigs.upload }
        }
    }
}
